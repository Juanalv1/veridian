services:
  - type: web
    name: veridian-engine
    runtime: python
    rootDir: engine
    buildCommand: pip install -r requirements.txt
    # One process: SQLite writes are serialized by an in-process lock.
    startCommand: uvicorn veridian_engine.api:create_app --factory --host 0.0.0.0 --port $PORT
    # Paid plan: free instances cannot attach a disk and spin down after 15 min idle.
    plan: starter
    region: oregon
    healthCheckPath: /health
    # Without a disk the filesystem is ephemeral and every deploy would wipe the profiles.
    disk:
      name: veridian-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: VERIDIAN_DB
        value: /var/data/veridian.db
      # "client=token,..." for each customer app (the demo app's middleware uses one).
      - key: VERIDIAN_TOKENS
        sync: false
      # Unset: rule-only engine, no AI decisions.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VERIDIAN_LEARN_DELAY_MIN
        value: "10"
      # Proxies that append to X-Forwarded-For in front of the engine. 3 is what was measured for
      # the demo app on the same platform (edge/README.md); not measured for the engine itself.
      - key: VERIDIAN_TRUSTED_PROXIES
        value: "3"
      # Demo rehearsals only: secret that enables POST /v1/admin/reset (header X-Veridian-Reset-Token).
      # Leave unset for real customers. Replaced by DELETE /v1/projects/{id}/data (U13).
      - key: VERIDIAN_RESET_TOKEN
        sync: false
      # Service credential of the panel (same value as the panel's VERIDIAN_PANEL_TOKEN). Unset: no panel.
      - key: VERIDIAN_PANEL_TOKEN
        sync: false
      # Email that owns org "Demo" (the legacy projects) on first login.
      - key: VERIDIAN_BOOTSTRAP_OWNERS
        sync: false
      # Emails allowed to create organizations (provisional, open decision 2). Unset: nobody.
      - key: VERIDIAN_ORG_CREATORS
        sync: false
