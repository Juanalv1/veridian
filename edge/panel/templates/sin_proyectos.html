{% extends "auth_base.html" %}
{% block title %}Sin organización{% endblock %}
{% block content %}
  <div class="auth-heading">
    <h1>Todavía no perteneces a ninguna organización</h1>
    <p class="auth-muted">Pide al administrador de tu equipo que te invite a su organización con este correo.</p>
  </div>
  <p class="auth-who">{{ email }}</p>
  <div class="auth-actions">
    <a class="btn btn-secondary" href="/auth/google">Usar otra cuenta</a>
    <a class="btn btn-ghost" href="/organizaciones/nueva">Crear organización</a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn btn-ghost" type="submit">Cerrar sesión</button>
    </form>
  </div>
{% endblock %}
