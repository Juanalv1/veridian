<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
{% block head_extra %}{% endblock %}
<meta name="htmx-config" content='{"historyCacheSize":0,"includeIndicatorStyles":false}'>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veridian · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="/static/tokens.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/panel.css?v={{ asset_version }}">
</head>
<body hx-ext="preload">
<header>
  <div class="wrap">
    <div class="brand">
      <span class="wordmark">Veridian</span>
      <span class="app">Panel</span>
    </div>
    <div id="conn" class="conn{% if engine_error %} down{% endif %}" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span>{% if engine_error %}Motor sin conexión{% else %}En vivo{% endif %}</span>
    </div>
  </div>
</header>

{% block content %}{% endblock %}
<script src="/static/htmx.min.js?v={{ asset_version }}"></script>
<script src="/static/preload.js?v={{ asset_version }}"></script>
<script src="/static/panel.js?v={{ asset_version }}"></script>
</body>
</html>
