{% extends "base.html" %}
{% block head_extra %}<noscript><meta http-equiv="refresh" content="{{ refresh }};url={{ refresh_url }}"></noscript>{% endblock %}
{% block content %}
{% from "partials/macros.html" import live_attrs %}
<main {{ live_attrs(refresh_url, "rutas", refresh) }}>
  <div class="page-head">
    <h1 class="page-title">Rutas críticas</h1>
    {% if engine_error %}<div class="note warn">{{ engine_error }}</div>{% endif %}
  </div>
  <div class="note calm">{{ empty }}</div>
</main>
{% endblock %}
