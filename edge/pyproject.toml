[project]
name = "veridian-edge"
version = "0.1.0"
description = "Veridian edge: demo app, panel and a fake engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx",
    "python-multipart",
    "itsdangerous",
    "veridian-sdk",
]

[tool.uv.sources]
veridian-sdk = { path = "../sdk/python", editable = true }

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = []
