<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Facturas{% endblock %} · Facturas Demo</title>
<style>
  :root { --ink:#1b2430; --muted:#6b7686; --line:#e3e8ef; --bg:#f5f7fa; --brand:#2457d6; --ok:#13795b; --warn:#a15c07; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); }
  .bar { max-width:880px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:24px; }
  .logo { font-weight:700; color:var(--brand); font-size:1.15rem; margin-right:auto; }
  nav a { color:var(--ink); text-decoration:none; margin-right:18px; }
  nav a:hover { color:var(--brand); }
  .who { color:var(--muted); font-size:.9rem; }
  main { max-width:880px; margin:32px auto; padding:0 20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:24px; }
  h1 { margin:0 0 16px; font-size:1.6rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  a { color:var(--brand); }
  label { display:block; margin:14px 0 4px; font-weight:600; }
  input { width:100%; padding:10px 12px; border:1px solid #c9d1dc; border-radius:8px; font:inherit; }
  button, .btn { display:inline-block; margin-top:18px; padding:10px 18px; border:0; border-radius:8px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  button.link { background:none; color:var(--muted); margin:0; padding:0; font-weight:400; }
  .badge { padding:2px 10px; border-radius:999px; font-size:.8rem; font-weight:600; }
  .Pagada { background:#dff5ec; color:var(--ok); } .Pendiente { background:#fdf0d9; color:var(--warn); }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:12px; }
  .error { background:#fde4e4; color:#9b1c1c; } .okmsg { background:#dff5ec; color:var(--ok); }
  .muted { color:var(--muted); } .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  form.inline { display:inline; }
  .narrow { max-width:400px; margin:0 auto; }
</style>
</head>
<body>
<header><div class="bar">
  <span class="logo">Facturas Demo</span>
  {% if user %}
  <nav><a href="/invoices">Facturas</a><a href="/invoices/export">Exportar CSV</a><a href="/payouts/bank-account">Cuenta de cobros</a></nav>
  <span class="who">{{ user.name }}</span>
  <form class="inline" method="post" action="/logout"><button class="link" type="submit">Salir</button></form>
  {% endif %}
</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
