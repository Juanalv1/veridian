<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Facturas{% endblock %} · Facturas Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% if user %}
<header class="top">
  <div class="bar">
    <a class="brand" href="/invoices"><span class="mark" aria-hidden="true">F</span>Facturas Demo</a>
    <nav aria-label="Principal">
      <a href="/invoices"{% if active == "invoices" %} aria-current="page"{% endif %}>Facturas</a>
      <a href="/payouts/bank-account"{% if active == "bank" %} aria-current="page"{% endif %}>Cuenta de cobros</a>
    </nav>
    <div class="account">
      <span class="avatar" aria-hidden="true">{{ user.name.split()|map("first")|join }}</span>
      <span class="who"><span class="name">{{ user.name }}</span><span class="org">{{ user.company }}</span></span>
      <form method="post" action="/logout"><button class="quiet" type="submit">Salir</button></form>
    </div>
  </div>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
<script src="/static/busy.js?v={{ asset_version }}"></script>
</body>
</html>
