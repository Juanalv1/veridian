{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block body_class %}solo{% endblock %}
{% block content %}
<div class="solo-col">
  <span class="mark lg" aria-hidden="true">F</span>
  <h1>Inicia sesión</h1>
  <p class="sub">Accede a las facturas de tu empresa.</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <div class="field">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" value="ana@facturas.demo" required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="primary wide" type="submit" data-busy="Entrando…">Entrar</button>
  </form>
</div>
{% endblock %}
