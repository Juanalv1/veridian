{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Inicia sesión</h1>
  <p class="lead">Accede a las facturas de tu empresa.</p>
  {% if error %}<div class="msg error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" autocomplete="username" value="ana@facturas.demo" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="block" type="submit" data-busy="Entrando…">Entrar</button>
  </form>
</div>
{% endblock %}
