# Route classification used by the block rule (see docs/REPARTO.md, contract 1).
# Key: "METHOD /route/template", method upper-case. Exact match only.
# Classes: critical | sensitive | normal. Anything not listed is "normal".
routes:
  GET /invoices/export: sensitive
  GET /payouts/bank-account: sensitive
  POST /payouts/bank-account: critical
